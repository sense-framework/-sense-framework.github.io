<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SENSE">
<title>SENSE</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#f7f5f2;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.boot{position:fixed;inset:0;display:grid;place-content:center;gap:24px;background:radial-gradient(circle at 50% 42%,rgba(227,19,44,.09),transparent 24rem),#020202}.mark{width:78px;aspect-ratio:1;border:1px solid rgba(227,19,44,.65);border-radius:24px;position:relative;margin:auto;box-shadow:0 0 60px rgba(227,19,44,.18)}.mark:before,.mark:after{content:"";position:absolute;inset:17px;border:1px solid #fff;transform:rotate(45deg)}.mark:after{inset:28px;border-color:#e3132c}.name{text-align:center;font-weight:900;letter-spacing:.42em;padding-left:.42em}.bar{width:176px;height:2px;background:#18181a;overflow:hidden}.bar i{display:block;width:45%;height:100%;background:#e3132c;animation:load 1.15s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(330%)}}.error{max-width:330px;color:#aaa;text-align:center;line-height:1.5;font-size:.82rem}.retry{border:1px solid rgba(227,19,44,.6);background:#17080b;color:#fff;border-radius:14px;padding:12px 18px;margin:auto;cursor:pointer}
</style>
</head>
<body>
<div class="boot"><div class="mark"></div><div class="name">SENSE</div><div class="bar"><i></i></div><div class="error" id="error"></div><button class="retry" id="retry" hidden>Retry</button></div>
<script>
(async()=>{const parts=[...Array.from({length:4},(_,i)=>`./_release/app.part-${String(i).padStart(2,'0')}?v=0.2.1`),...Array.from({length:6},(_,i)=>`./_release/app.tail-${String(i).padStart(2,'0')}?v=0.2.1`)];const error=document.getElementById('error'),retry=document.getElementById('retry');retry.onclick=()=>location.reload();try{const texts=await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(`Missing application asset (${r.status})`);return r.text()}));const binary=atob(texts.join('').replace(/\s+/g,''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('This browser needs a current system update to open SENSE.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const tag='<script src="./romeo.js?v=0.2.1"><\/script><script src="./romeo-mobile.js?v=0.2.1"><\/script>';const patched=html.includes('</body>')?html.replace('</body>',`${tag}</body>`):`${html}${tag}`;document.open();document.write(patched);document.close()}catch(e){error.textContent=e.message||'SENSE could not start.';retry.hidden=false}})();
</script>
</body>
</html>
