<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020202">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SENSE">
<title>SENSE</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./senseos.css?v=0.3.0">
</head>
<body>
<div class="boot" id="boot"><img src="./icon.svg" alt=""><strong>SENSE</strong><i></i></div>
<main class="landing" id="landing">
  <div class="landing-glow"></div>
  <button class="landing-mark" id="openAuth" aria-label="Open SENSE"><img src="./icon.svg" alt=""><span>SENSE</span></button>
</main>
<section class="auth hidden" id="auth" aria-modal="true" role="dialog">
  <div class="glass auth-card">
    <button class="close" id="closeAuth" aria-label="Close">×</button>
    <img src="./icon.svg" alt="" class="auth-logo">
    <h1>SENSE</h1>
    <form id="loginForm"><label>Email<input type="email" id="email" autocomplete="email" required></label><label>Password<input type="password" id="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form>
    <button class="secondary" id="preview" type="button">Temporary administrator</button>
  </div>
</section>
<section class="app hidden" id="app">
  <aside class="rail glass">
    <button class="brand nav-target active" data-view="home" aria-label="Home"><img src="./icon.svg" alt=""></button>
    <nav><button class="nav-target" data-view="feed" aria-label="Feed">◉</button><button class="nav-target" data-view="messages" aria-label="Messages">✉</button><button class="nav-target" data-view="people" aria-label="People">◎</button><button class="nav-target" data-view="files" aria-label="Files">▣</button><button class="nav-target" data-view="projects" aria-label="Projects">⌘</button><button class="nav-target" data-view="ai" aria-label="AI">✦</button><button class="nav-target" data-view="calendar" aria-label="Calendar">◇</button><button class="nav-target" data-view="admin" aria-label="Admin">◆</button></nav>
    <button class="nav-target rail-settings" data-view="system" aria-label="System">⚙</button>
  </aside>
  <header class="topbar glass"><div class="crumb"><i></i><span id="viewTitle">SENSE</span></div><button class="search-button" id="searchButton">Search <kbd>⌘ K</kbd></button><div class="top-actions"><span class="sync"><i></i><b>LOCAL</b></span><button class="avatar" id="profileButton">A</button></div></header>
  <div class="workspace">
    <section class="view active" id="view-home"><div class="home-empty glass"><img src="./icon.svg" alt=""><h1>SENSE</h1></div><div class="module-grid"><button class="module-card glass nav-target" data-view="feed"><span>◉</span><b>Feed</b><small>0</small></button><button class="module-card glass nav-target" data-view="messages"><span>✉</span><b>Messages</b><small>0</small></button><button class="module-card glass nav-target" data-view="people"><span>◎</span><b>People</b><small>0</small></button><button class="module-card glass nav-target" data-view="files"><span>▣</span><b>Files</b><small>0</small></button><button class="module-card glass nav-target" data-view="projects"><span>⌘</span><b>Projects</b><small>0</small></button><button class="module-card glass nav-target" data-view="calendar"><span>◇</span><b>Calendar</b><small>0</small></button></div></section>
    <section class="view" id="view-feed"><header class="page-head"><h1>Feed</h1><button class="primary" id="newPost">New post</button></header><div class="empty-state glass"><span>◉</span><h2>No posts</h2></div></section>
    <section class="view" id="view-messages"><header class="page-head"><h1>Messages</h1><button class="primary" id="newMessage">New message</button></header><div class="empty-state glass"><span>✉</span><h2>No conversations</h2></div></section>
    <section class="view" id="view-people"><header class="page-head"><h1>People</h1><button class="primary" id="invitePerson">Invite</button></header><div class="empty-state glass"><span>◎</span><h2>No people</h2></div></section>
    <section class="view" id="view-files"><header class="page-head"><h1>Files</h1><button class="primary" id="uploadFile">Upload</button></header><div class="empty-state glass"><span>▣</span><h2>No files</h2></div></section>
    <section class="view" id="view-projects"><header class="page-head"><h1>Projects</h1><button class="primary" id="newProject">New project</button></header><div class="empty-state glass"><span>⌘</span><h2>No projects</h2></div></section>
    <section class="view" id="view-ai"><div class="ai-shell glass"><main><div class="empty-state ai-empty"><span>✦</span><h2>AI</h2></div><form id="aiForm"><textarea id="aiInput" placeholder="Message"></textarea><button>↑</button></form></main><aside><button class="secondary" id="openRomeoFromAI">Romeo</button></aside></div></section>
    <section class="view" id="view-calendar"><header class="page-head"><h1>Calendar</h1><button class="primary" id="newEvent">New event</button></header><div class="empty-state glass"><span>◇</span><h2>No events</h2></div></section>
    <section class="view" id="view-admin"><header class="page-head"><h1>Administration</h1></header><div class="admin-grid"><article class="glass panel"><h2>Users</h2><strong>0</strong></article><article class="glass panel"><h2>Broadcasts</h2><strong>0</strong></article><article class="glass panel"><h2>Audit</h2><strong>0</strong></article></div></section>
    <section class="view" id="view-system"><header class="page-head"><h1>System</h1></header><div class="settings-grid"><article class="glass panel"><h2>Account</h2><button class="secondary" id="logout">Sign out</button></article><article class="glass panel"><h2>Workspace API</h2><input id="apiEndpoint" placeholder="https://"><button class="primary" id="saveApi">Save</button></article><article class="glass panel"><h2>Application</h2><button class="secondary" id="installButton">Install</button></article></div></section>
  </div>
  <nav class="mobile-nav glass"><button class="nav-target active" data-view="home"><b>⌂</b><span>Home</span></button><button class="nav-target" data-view="feed"><b>◉</b><span>Feed</span></button><button class="nav-target" data-view="messages"><b>✉</b><span>Chat</span></button><button class="nav-target" data-view="projects"><b>⌘</b><span>Work</span></button><button class="nav-target" data-view="system"><b>⚙</b><span>System</span></button></nav>
</section>
<section class="search-overlay hidden" id="searchOverlay"><div class="glass search-card"><input id="globalSearch" placeholder="Search"><button id="closeSearch">×</button><div id="searchResults"></div></div></section>
<div class="toast" id="toast"></div>
<script src="./senseos.js?v=0.3.0"></script><script src="./romeo.js?v=0.3.0"></script><script src="./romeo-mobile.js?v=0.3.0"></script>
</body>
</html>
