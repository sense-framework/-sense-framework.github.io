<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#090b10">
  <title>Page Not Found</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 12%,rgba(107,232,255,.1),transparent 28rem),radial-gradient(circle at 20% 82%,rgba(255,73,104,.1),transparent 26rem),#090b10;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,640px);padding:48px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(17,21,31,.78);box-shadow:0 28px 80px rgba(0,0,0,.34)}.mark{width:52px;aspect-ratio:1;margin-bottom:30px;border:1px solid rgba(255,73,104,.6);border-radius:16px;position:relative}.mark:before,.mark:after{content:"";position:absolute;inset:11px;border:1px solid rgba(107,232,255,.72);border-radius:5px;transform:rotate(45deg)}.mark:after{inset:17px;border-color:#fff}p{color:#9aa4b5;line-height:1.65}h1{margin:0;font-size:clamp(3rem,10vw,6rem);line-height:.95;letter-spacing:-.06em}a{display:inline-flex;margin-top:22px;padding:13px 18px;border:1px solid rgba(255,73,104,.8);border-radius:14px;background:#ff4968;color:white;text-decoration:none;font-weight:750}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>Page not found.</h1>
    <p>The requested page is not available. No public information is provided at this address.</p>
    <a href="./">Return home</a>
  </main>
</body>
