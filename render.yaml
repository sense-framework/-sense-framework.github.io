services:
  - type: web
    name: sense-platform-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: sense_platform
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_HOURS
        value: "12"
      - key: COOKIE_SAME_SITE
        value: "None"
      - key: REQUIRE_ADMIN_MFA
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: OWNER_BOOTSTRAP_TOKEN
        generateValue: true
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        value: https://sense-framework.github.io
      - key: FRONTEND_URL
        value: https://sense-framework.github.io
      - key: TRUST_PROXY
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: COINBASE_KEY_NAME
        sync: false
      - key: COINBASE_KEY_SECRET
        sync: false
      - key: COINBASE_WEBHOOK_SECRET
        sync: false
