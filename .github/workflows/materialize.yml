name: Materialize SenseOS
on:
  workflow_dispatch:
  push:
    paths:
      - '_release/app.part-*'
      - '_release/app.tail-*'
      - 'romeo.js'
      - 'romeo-mobile.js'
      - '.github/workflows/materialize.yml'
permissions:
  contents: write
concurrency:
  group: materialize-senseos
  cancel-in-progress: true
jobs:
  materialize:
    if: "!contains(github.event.head_commit.message || '', '[skip materialize]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct browser-ready HTML
        run: |
          set -euo pipefail
          cat _release/app.part-* _release/app.tail-* | tr -d '\r\n\t ' | base64 -d | gzip -dc > /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path('/tmp/index.html')
          html = page.read_text(encoding='utf-8')
          scripts = '<script src="./romeo.js?v=0.2.2"></script><script src="./romeo-mobile.js?v=0.2.2"></script>'
          if 'romeo.js?v=0.2.2' not in html:
              html = html.replace('</body>', scripts + '</body>')
          Path('index.html').write_text(html, encoding='utf-8')
          PY
      - name: Validate generated client
        run: |
          test -s index.html
          grep -q 'id="appShell"' index.html
          grep -q 'romeo.js?v=0.2.2' index.html
          node --check romeo.js
          node --check romeo-mobile.js
      - name: Commit materialized client
        run: |
          git config user.name "senseos-build[bot]"
          git config user.email "senseos-build[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Materialize browser-ready SenseOS [skip materialize]"
          git push
