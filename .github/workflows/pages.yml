name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Expand verified release bundle
        run: |
          set -euo pipefail
          mkdir _site
          cat _bundle/frontend.part-* > /tmp/sense-frontend.tar.gz
          tar -xzf /tmp/sense-frontend.tar.gz -C _site
          cp _patch/demo-admin.js _site/demo-admin.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          tag = '<script src="./demo-admin.js"></script>'
          if tag not in html:
              html = html.replace('</body>', f'  {tag}\n</body>')
          page.write_text(html, encoding='utf-8')
          PY
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4