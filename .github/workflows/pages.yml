name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static artifact
        run: |
          set -euo pipefail
          mkdir -p _site/_company
          cp index.html senseos.css senseos.js company.css company.js enterprise.css enterprise.js manifest.webmanifest sw.js icon.svg romeo.js _site/
          cp _company/company.part-* _site/_company/
          touch _site/.nojekyll
          grep -q 'company.js?v=0.6.0' _site/index.html
          grep -q 'enterprise.js' company.js
          test -s _site/enterprise.js
          test -s _site/enterprise.css
          ! grep -q 'DecompressionStream' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
