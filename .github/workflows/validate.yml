name: Validate
on:
  push:
    branches: [main, agent/unified-workspace-v2]
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate direct client
        run: |
          set -euo pipefail
          test -s index.html
          test -s senseos.css
          test -s senseos.js
          test -s romeo.js
          test -s romeo-mobile.js
          grep -q 'id="app"' index.html
          grep -q 'senseos.js' index.html
          grep -q 'romeo.js' index.html
          ! grep -q 'DecompressionStream' index.html
          node --check senseos.js
          node --check romeo.js
          node --check romeo-mobile.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          test -s icon.svg
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct API
        run: |
          cat _release/backend.part-* | base64 -d | tar -xz -C backend
      - working-directory: backend
        run: npm install --no-audit --no-fund
      - working-directory: backend
        run: npm test
