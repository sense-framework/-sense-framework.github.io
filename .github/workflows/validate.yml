name: Validate
on:
  push:
    branches: [main, agent/unified-workspace-v2]
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct and validate client
        run: |
          set -euo pipefail
          cat _release/app.part-* _release/app.tail-* | base64 -d | gzip -dc > /tmp/sense.html
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          html=Path('/tmp/sense.html').read_text()
          loader=Path('index.html').read_text()
          assert '<title>SENSE</title>' in html
          assert 'id="appShell"' in html
          assert 'romeo.js' in loader
          assert '#/romeo' in Path('manifest.webmanifest').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
          Path('/tmp/app.js').write_text(scripts[-1])
          json.loads(Path('manifest.webmanifest').read_text())
          PY
          node --check /tmp/app.js
          node --check romeo.js
          node --check sw.js
          test -s icon.svg
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct API
        run: |
          cat _release/backend.part-* | base64 -d | tar -xz -C backend
      - working-directory: backend
        run: npm install --no-audit --no-fund
      - working-directory: backend
        run: npm test
