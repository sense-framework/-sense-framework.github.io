name: Validate
on:
  push:
    branches: [main, agent/company-platform-v5]
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate direct client
        run: |
          set -euo pipefail
          test -s index.html
          test -s senseos.css
          test -s senseos.js
          test -s romeo.js
          test -s icon.svg
          grep -q 'id="app"' index.html
          for route in organization knowledge policies tasks approvals requests assets forms careers learning analytics status more profile faq contact security privacy terms; do
            grep -q "id=\"view-$route\"" index.html
          done
          grep -q "departments: \[\]" senseos.js
          grep -q "requests: \[\]" senseos.js
          grep -q "assets: \[\]" senseos.js
          ! grep -R -E 'Morgan Reed|Jordan Lee|Riley Chen|Project Romeo|SENSE Framework|Zeroform|SenseOS Product Brief|Romeo Architecture' index.html senseos.js romeo.js README.md manifest.webmanifest
          ! grep -q 'DecompressionStream' index.html
          node --check senseos.js
          node --check romeo.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct API
        run: |
          cat _release/backend.part-* | base64 -d | tar -xz -C backend
      - working-directory: backend
        run: npm install --no-audit --no-fund
      - working-directory: backend
        run: npm test
